name: macOS app archive
on:
  workflow_dispatch:
    inputs:
      signed:
        description: Sign, notarize and staple (requires private environment secrets)
        type: boolean
        default: false
  workflow_call:
    inputs:
      signed:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  app:
    runs-on: macos-15
    environment: ${{ inputs.signed && 'apple-signing' || '' }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - uses: dtolnay/rust-toolchain@1.98.1
      - run: cargo test --locked --manifest-path apps/monoprint-gui/Cargo.toml --target-dir target/gui --bin monoprint-gui
      - if: ${{ !inputs.signed }}
        run: python3 apps/monoprint-gui/scripts/bundle-macos.py --archive-dir output/macos-app
      - if: ${{ inputs.signed }}
        run: python3 scripts/with-apple-signing.py -- python3 apps/monoprint-gui/scripts/bundle-macos.py --archive-dir output/macos-app
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      - run: codesign --verify --deep --strict target/gui/Monoprint.app
      - if: ${{ !inputs.signed }}
        run: python3 scripts/test-app-package.py --from output/macos-app
      - if: ${{ inputs.signed }}
        run: python3 scripts/test-app-package.py --from output/macos-app --require-notarized
      - run: python3 apps/monoprint-gui/scripts/test-shortcuts.py
        env:
          MONOPRINT_CLI: target/gui/Monoprint.app/Contents/MacOS/monoprint
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: output/macos-app/*
          if-no-files-found: error
