name: Checks
on: [push, pull_request]
jobs:
  native:
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/grammar-policy.test.mjs
      - run: node scripts/import-grammar-metadata.mjs --check
      - run: node scripts/import-editor-themes.mjs --check
      - run: python3 scripts/fetch-fallback-fonts.py --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --package monoprint -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --release
      - run: cargo test --manifest-path vendor/takumi-raster/Cargo.toml --locked --release --lib
      - run: cargo test --locked --release --no-default-features
      - run: cargo doc --locked --no-default-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --locked --release
      - run: ./target/release/monoprint fixtures/example.ts -o example.png
  studio:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path apps/monoprint-gui/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path apps/monoprint-gui/Cargo.toml --target-dir target/gui --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path apps/monoprint-gui/Cargo.toml --target-dir target/gui --bin monoprint-gui
      - run: python3 apps/monoprint-gui/scripts/bundle-macos.py --debug
      - run: python3 apps/monoprint-gui/scripts/test-shortcuts.py
        env:
          MONOPRINT_CLI: target/gui/debug/monoprint
      - run: codesign --verify --deep --strict target/gui/Monoprint.app
