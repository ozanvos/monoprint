name: Checks
on:
  # Branches are checked through their pull request; pushes check main only.
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Pull requests and pushes run only the jobs their changed files can affect.
  # Release and manual runs (workflow_call, workflow_dispatch) always run everything.
  scope:
    runs-on: ubuntu-24.04
    outputs:
      website: ${{ steps.scope.outputs.website }}
      app: ${{ steps.scope.outputs.app }}
      studio: ${{ steps.scope.outputs.studio }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$EVENT" != pull_request && "$EVENT" != push ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            printf 'website=true\napp=true\nstudio=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          printf '%s\n' "$files"
          # Lists the changed files matching (-E) or not matching (-vE) a pattern; empty is fine.
          pick() { printf '%s\n' "$files" | grep "$@" || true; }
          # The site, company page, docs and top-level README never reach the app, CLI or
          # packages, except the two docs bundled as license notices.
          app=$(pick -vE '^(website/|company-site/|\.claude/|docs/)|^README\.md$'; pick -E '^docs/(grammar-licenses|font-fallback)\.md$')
          website=$(pick -E '^(website/|release/|scripts/|\.github/workflows/ci\.yml)')
          studio=$(printf '%s\n' "$app" | grep -vE '^bindings/|^$' || true)
          {
            echo "website=$([[ -n "$website" ]] && echo true || echo false)"
            echo "app=$([[ -n "$app" ]] && echo true || echo false)"
            echo "studio=$([[ -n "$studio" ]] && echo true || echo false)"
          } | tee -a "$GITHUB_OUTPUT"
  website:
    needs: scope
    if: needs.scope.outputs.website == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --prefix website
      - run: npm run check --prefix website
      - run: node --test scripts/verify-desktop-release.test.mjs
      - run: node --test scripts/npm-trust.test.mjs
  native:
    needs: scope
    if: needs.scope.outputs.app == 'true'
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
      - run: node --test scripts/release.test.mjs
      - run: node --test scripts/package-receipts.test.mjs
      - run: python3 scripts/test_macos_release.py
      - run: python3 scripts/test_desktop_updates.py
      - run: python3 scripts/test_desktop_release.py
      - run: node --test scripts/grammar-policy.test.mjs
      - run: node scripts/import-grammar-metadata.mjs --check
      - run: node scripts/import-editor-themes.mjs --check
      - run: python3 scripts/fetch-fallback-fonts.py --check
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --package monoprint -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --release
      - run: cargo run --locked --release --example compile_pierre_palettes -- --check
      - run: cargo test --manifest-path vendor/takumi-raster/Cargo.toml --locked --release --lib
      - run: cargo test --locked --release --no-default-features
      - run: cargo doc --locked --no-default-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --locked --release
      - run: ./target/release/monoprint fixtures/example.ts -o example.png
  studio:
    needs: scope
    if: needs.scope.outputs.studio == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Check the native icon compiler before building Rust
        run: python3 apps/monoprint-gui/scripts/build-icon.py --output target/gui/icon-check
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path apps/monoprint-gui/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path apps/monoprint-gui/Cargo.toml --target-dir target/gui --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path apps/monoprint-gui/Cargo.toml --target-dir target/gui --bin monoprint-gui
      - run: python3 apps/monoprint-gui/scripts/bundle-macos.py --debug
      - run: python3 apps/monoprint-gui/scripts/test-shortcuts.py
        env:
          MONOPRINT_CLI: target/gui/debug/monoprint
      - run: codesign --verify --deep --strict target/gui/Monoprint.app
  msrv:
    needs: scope
    if: needs.scope.outputs.app == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - run: cargo check --locked --all-targets
