name: Website
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy the verified website to Cloudflare
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: monoprint-website
  cancel-in-progress: false
jobs:
  website:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.publish && 'website' || '' }}
    env:
      MONOPRINT_DOWNLOAD_MANIFEST: ${{ github.workspace }}/output/published.json
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment configuration before building
        if: ${{ inputs.publish }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN in website'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID in website'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Resolve links from the complete public release
        run: node scripts/verify-desktop-release.mjs --out "$MONOPRINT_DOWNLOAD_MANIFEST"
      - run: cargo build --locked --release
      - run: npm ci --prefix website
      - run: npm run check --prefix website
      - run: npm run build --prefix website
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-website.mjs --from website/dist --out output/website-check
      - uses: actions/upload-artifact@v4
        with:
          name: website-downloads
          path: |
            website/dist
            output/website-check
      - name: Deploy the verified download page
        if: ${{ inputs.publish }}
        run: npm run deploy --prefix website
        env:
          MONOPRINT_WEBSITE_PUBLISH: approved
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
