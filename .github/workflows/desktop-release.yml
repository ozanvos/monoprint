name: Desktop release
on:
  workflow_dispatch:
    inputs:
      signed:
        description: Use Apple and Windows signing credentials; prepare signed update feeds
        type: boolean
        default: false
      publish:
        description: Publish the verified signed packages to GitHub Releases
        type: boolean
        default: false
      tag:
        description: Existing vVERSION tag at this commit (required when publishing)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  # Serialize all channel promotions, including dispatches from different refs.
  group: desktop-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      include_windows: ${{ steps.platforms.outputs.include_windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
      - id: platforms
        name: Select committed release platforms
        run: node --input-type=module -e "import c from './release/config.json' with {type:'json'}; console.log('include_windows=' + c.desktopPlatforms.includes('win-x64'))" >> "$GITHUB_OUTPUT"
      - name: Validate version, tag, repository and publication approval
        env:
          SIGNED: ${{ inputs.signed }}
          PUBLISH: ${{ inputs.publish }}
          RELEASE_TAG: ${{ inputs.tag }}
          MONOPRINT_PUBLIC_PUBLISH: approved
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.private && 'private' || 'public' }}
        run: |
          node --input-type=module <<'JS'
          import { checkRelease } from './scripts/release-config.mjs';
          const publish = process.env.PUBLISH === 'true';
          if (publish && (process.env.SIGNED !== 'true' || !process.env.RELEASE_TAG)) {
            throw new Error('Publishing requires signed packages and an existing version tag');
          }
          await checkRelease({ publicPublish: publish, tag: process.env.RELEASE_TAG || undefined });
          JS
  checks:
    needs: preflight
    uses: ./.github/workflows/ci.yml
  macos:
    needs: preflight
    uses: ./.github/workflows/macos-app.yml
    with:
      signed: ${{ inputs.signed }}
      updates: ${{ inputs.signed }}
    secrets: inherit
  desktop:
    needs: preflight
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/desktop-app.yml
    with:
      include_windows: ${{ needs.preflight.outputs.include_windows == 'true' }}
      signed: ${{ inputs.signed }}
    secrets: inherit
  assemble:
    needs: [checks, macos, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: output/inputs
      - name: Verify all platforms and update feeds against this source
        env:
          SIGNED: ${{ inputs.signed }}
        run: |
          args=()
          if [ "$SIGNED" = true ]; then args+=(--distribution); fi
          python scripts/desktop_release.py --from output/inputs --out output/desktop-release "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release
          path: output/desktop-release/*
          if-no-files-found: error
  publish:
    if: ${{ inputs.publish }}
    needs: assemble
    runs-on: ubuntu-24.04
    environment: public-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: output/inputs
      - name: Revalidate the tag and the exact packages before publishing
        env:
          MONOPRINT_PUBLIC_PUBLISH: approved
          RELEASE_TAG: ${{ inputs.tag }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.private && 'private' || 'public' }}
        run: |
          node scripts/release.mjs check --public --tag "$RELEASE_TAG"
          python scripts/desktop_release.py --from output/inputs --out output/release --distribution
      - name: Sign build provenance for every published file
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: output/release/*
          create-storage-record: false
      - name: Include the verifiable Sigstore signature bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" output/release/provenance.sigstore.json
      - name: Upload into a draft, then promote the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # No --clobber: published versions and their bytes are immutable here.
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Monoprint $version" --notes-file "release/notes/$version.md" output/release/*
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Verify the public download contract
        run: node scripts/verify-desktop-release.mjs --out output/published.json --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag }}
  website:
    needs: publish
    uses: ./.github/workflows/website.yml
    with:
      publish: true
    secrets: inherit
