name: Windows and Linux desktop packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            runtime: win-x64
          - runner: ubuntu-24.04
            runtime: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: ${{ matrix.runtime == 'linux-x64' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libfontconfig1-dev libfreetype6-dev libxcb1-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libssl-dev libfuse2t64 desktop-file-utils
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet tool install --global vpk --version 1.2.161
      - run: cargo fetch --locked --manifest-path apps/monoprint-gui/Cargo.toml
      - run: cargo clippy --locked --manifest-path apps/monoprint-gui/Cargo.toml --target-dir target/gui --bin monoprint-gui -- -D warnings
      - run: cargo test --locked --manifest-path apps/monoprint-gui/Cargo.toml --target-dir target/gui --bin monoprint-gui
      - run: python scripts/test_desktop_updates.py
      - if: ${{ matrix.runtime == 'linux-x64' }}
        run: |
          python apps/monoprint-gui/scripts/prepare-linuxdeploy.py --output target/update-tools/linuxdeploy.AppImage
          python apps/monoprint-gui/scripts/bundle-desktop.py --runtime linux-x64 --output output/desktop-linux-x64 --linuxdeploy target/update-tools/linuxdeploy.AppImage --update-feed "${MONOPRINT_UPDATE_FEED}" --local
        env:
          MONOPRINT_UPDATE_FEED: ${{ vars.MONOPRINT_LINUX_UPDATE_FEED }}
      - if: ${{ matrix.runtime == 'win-x64' }}
        run: python apps/monoprint-gui/scripts/bundle-desktop.py --runtime win-x64 --output output/desktop-win-x64 --update-feed "$env:MONOPRINT_UPDATE_FEED" --local
        env:
          MONOPRINT_UPDATE_FEED: ${{ vars.MONOPRINT_WINDOWS_UPDATE_FEED }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.runtime }}
          path: output/desktop-${{ matrix.runtime }}/*
          if-no-files-found: error
