[package]
name = "code-images"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Offline code images with legacy frames themes, powered by Giallo and Takumi"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
giallo = { version = "=0.5.2", features = ["dump"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
takumi = { version = "=2.14.0", features = ["svg-backend", "woff2", "from-html"] }
ttf-parser = "0.25"
png = "0.18"
image = { version = "0.25", default-features = false }

[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "code-images"
path = "src/main.rs"

[patch.crates-io]
takumi-svg = { path = "vendor/takumi-svg" }
