[package]
name = "monoprint"
version = "0.1.4"
edition = "2024"
license = "Apache-2.0"
description = "Offline code-image renderer and CLI"
repository = "https://github.com/ozanvos/monoprint"
rust-version = "1.97"
# See docs/library.md: the backend fixes must ship in registry dependencies first.
publish = false

[features]
default = ["cli"]
cli = ["dep:clap"]

[workspace]
members = ["bindings/node"]
default-members = ["."]
resolver = "3"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"], optional = true }
giallo = { version = "=0.5.2", features = ["dump"] }
pierre-highlights-rs = "=0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
takumi = { version = "=2.14.0", default-features = false, features = ["svg-source", "from-html"] }
# Direct dependencies preserve our fixes for path/git library consumers.
# Keep these path-only until the fixes are available in published backends.
takumi-raster = { path = "vendor/takumi-raster", default-features = false, features = ["svg"] }
takumi-svg = { path = "vendor/takumi-svg" }
ttf-parser = "0.25"
png = "0.18"
image = { version = "0.25", default-features = false }
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"] }
# Enable the existing shaper's dictionary segmentation for CJK and Thai text.
parley = { version = "0.11.1", default-features = false, features = ["complex-scripts"] }
rayon = "1.12"

[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "monoprint"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]
