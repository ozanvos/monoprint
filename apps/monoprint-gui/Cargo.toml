[package]
name = "monoprint-gui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Monoprint desktop code-image editor"
publish = false

# Keep native UI dependencies out of the CLI, library and Node workspace.
[workspace]

[dependencies]
gpui-kit = { version = "=0.6.6", features = ["tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-javascript", "tree-sitter-python"] }
monoprint = { path = "../..", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
tempfile = "3"

[dev-dependencies]
gpui-kit = { version = "=0.6.6", features = ["test-support"] }

[[test]]
name = "studio"
harness = false

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
