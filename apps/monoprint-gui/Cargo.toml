[package]
name = "monoprint-gui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Monoprint desktop code-image editor"
publish = false

# Keep native UI dependencies out of the CLI, library and Node workspace.
[workspace]

[dependencies]
gpui-kit = { version = "=0.6.6", features = ["tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-javascript", "tree-sitter-python"] }
monoprint = { path = "../..", default-features = false }
giallo = { version = "=0.5.2", features = ["dump"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
image = { version = "0.25", default-features = false }
tempfile = "3"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSGraphics", "NSResponder", "NSView", "NSVisualEffectView"] }
raw-window-handle = "0.6"

[dev-dependencies]
gpui-kit = { version = "=0.6.6", features = ["test-support"] }

[[test]]
name = "studio"
harness = false

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
