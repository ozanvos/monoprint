[package]
name = "monoprint-gui"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ozanvos/monoprint"
description = "Monoprint desktop code-image editor"
publish = false

# Keep native UI dependencies out of the CLI, library and Node workspace.
[workspace]

[features]
app-store = ["dep:gpui-macos", "gpui-macos/app-store", "dep:objc2-foundation"]

[dependencies]
gpui-kit = { version = "=0.8.0", features = ["gpui-fast", "tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-javascript", "tree-sitter-python"] }
monoprint = { path = "../..", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
image = { version = "0.25", default-features = false }
tempfile = "3"
url = "2"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
velopack = "=1.2.161"

[target.'cfg(target_os = "macos")'.dependencies]
gpui-macos = { package = "gpui-fast-macos", version = "=0.1.10", optional = true, default-features = false }
objc2 = "0.6"
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSString", "NSURL", "NSPathUtilities"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSGraphics", "NSResponder", "NSView", "NSVisualEffectView"] }
raw-window-handle = "0.6"

# Keep GPUI's default icons self-contained in development app bundles too.
# Otherwise RustEmbed reads from the build machine's Cargo cache at runtime.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rust-embed = { version = "8", features = ["debug-embed"] }

[dev-dependencies]
gpui-kit = { version = "=0.8.0", features = ["test-support"] }

[[test]]
name = "studio"
harness = false

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true

# Retain Select's native behavior while synchronizing its popup/shadow fade.
[patch.crates-io]
gpui-component = { path = "../../vendor/gpui-component" }
gpui-fast-macos = { path = "../../vendor/gpui-fast-macos" }
