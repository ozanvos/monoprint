[package]
name = "monoprint-gui"
version = "0.2.4"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ozanvos/monoprint"
description = "Monoprint desktop code-image editor"
publish = false

# Keep native UI dependencies out of the CLI, library and Node workspace.
[workspace]

[features]
app-store = ["dep:gpui-macos", "gpui-macos/app-store"]

[dependencies]
tact-base = { git = "ssh://git@github.com/ozanvos/monorepo.git", rev = "db7ad2be184335d38a5981b3bbf6cbda904e7ced" }
gpui-tact = { git = "ssh://git@github.com/ozanvos/monorepo.git", rev = "db7ad2be184335d38a5981b3bbf6cbda904e7ced", features = ["gpui-fast"] }
gpui = { package = "gpui-fast", version = "=0.1.13" }
gpui-platform = { package = "gpui-fast-platform", version = "=0.1.13", features = ["font-kit", "wayland", "x11", "runtime_shaders"] }
gpui-base = { git = "ssh://git@github.com/ozanvos/monorepo.git", rev = "db7ad2be184335d38a5981b3bbf6cbda904e7ced", features = ["gpui-fast"] }
monoprint = { path = "../..", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
image = { version = "0.25", default-features = false }
tempfile = "3"
url = "2"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
velopack = "=1.2.161"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui-macos = { package = "gpui-fast-macos", version = "=0.1.13", optional = true, default-features = false }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSString", "NSURL", "NSPathUtilities"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSGraphics", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSVisualEffectView"] }
raw-window-handle = "0.6"

[dev-dependencies]
gpui-platform = { package = "gpui-fast-platform", version = "=0.1.13", features = ["test-support"] }
gpui-base = { git = "ssh://git@github.com/ozanvos/monorepo.git", rev = "db7ad2be184335d38a5981b3bbf6cbda904e7ced", features = ["test-support"] }

[[test]]
name = "studio"
harness = false

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
gpui-fast-macos = { path = "../../vendor/gpui-fast-macos" }
